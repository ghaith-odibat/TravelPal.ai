# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: travelpal-ai
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # you'll be prompted for the value in the Render dashboard
      - key: RATE_LIMIT_MAX
        value: "20"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://ghaith-odibat.github.io # GitHub Pages site allowed to call the API
